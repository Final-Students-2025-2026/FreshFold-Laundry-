<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FreshFold">
  <!-- The header wordmark's badge, at favicon size: sage tile, white FF.
       A tab strip is 16px wide, so the two letters are the whole mark — the
       full "FreshFold" would be a grey smear at that size. -->
  <rect width="64" height="64" rx="14" fill="#5A5A40"/>
  <text x="32" y="43.5" text-anchor="middle"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-1" fill="#FFFFFF">FF</text>
</svg>
